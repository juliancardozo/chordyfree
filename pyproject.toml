[project]
name = "chordlocal"
version = "0.1.0"
description = "Analisis local de canciones: acordes, beats, tablaturas y partituras"
requires-python = ">=3.11,<3.12"

# Versiones fijadas al techo de Mac Intel x86_64: torch 2.2.2 es el ultimo
# wheel macosx_*_x86_64 publicado. NO actualizar torch en esta maquina.
dependencies = [
    "torch==2.2.2",
    "torchaudio==2.2.2",
    "beat-this>=1.1.0",
    "librosa>=0.11.0",
    "soxr>=0.5",
    "numpy<2",
    "yt-dlp>=2026.8.19",
    "basic-pitch[onnx]>=0.4.0",
    "pretty_midi>=0.2.11",
    "music21>=10.5.0",
    # numba 0.60 es la ultima con wheel cp311 para macOS x86_64; mas nuevo
    # intenta compilar llvmlite contra LLVM y falla.
    "numba==0.60.0",
    "llvmlite==0.43.0",
    # setuptools 81+ elimino pkg_resources, que resampy (via librosa) todavia importa.
    "setuptools<81",
    # ffmpeg como binario estatico: en macOS Monterey Homebrew ya no tiene bottles.
    "imageio-ffmpeg>=0.6.0",
    "soundfile>=0.13",
]

[project.scripts]
chordlocal = "chordlocal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chordlocal"]
